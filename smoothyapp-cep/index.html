<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SmoothyEdit Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #232323;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 280px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0d99ff;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #404040;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cf6679;
    }
    .status-dot.connected {
      background: #2ea043;
    }
    .status-text {
      font-size: 13px;
    }
    .help-text {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SmoothyEdit Bridge</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Connecting...</span>
    </div>
    <p class="help-text">
      This panel connects Premiere Pro to the SmoothyEdit desktop app.
      Keep this panel open while using SmoothyEdit.
    </p>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/bridge.js?v=20260419-marker-host-v5"></script>
</body>
</html>
